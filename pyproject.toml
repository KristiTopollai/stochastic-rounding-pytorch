[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sr-states"
version = "0.1.0"
description = "FP32-to-BF16 stochastic rounding and BF16 optimizer states in PyTorch and Triton"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "SR-States contributors"}]
dependencies = ["torch>=2.5"]
keywords = ["stochastic-rounding", "bfloat16", "pytorch", "triton", "optimizers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/KristiTopollai/stochastic-rounding-pytorch"
Issues = "https://github.com/KristiTopollai/stochastic-rounding-pytorch/issues"

[project.optional-dependencies]
triton = ["triton>=3.0; platform_system == 'Linux'"]
dev = ["numpy>=1.26", "pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["sr_states*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["cuda: requires an NVIDIA CUDA device", "statistical: randomized statistical test"]

[tool.ruff]
line-length = 100
target-version = "py310"

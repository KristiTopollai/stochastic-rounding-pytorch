[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sr-states"
version = "0.1.0"
description = "Stochastic-rounding optimizer kernels for low-precision GPU state storage"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SR-States contributors"}]
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
triton = ["triton>=3.0; platform_system == 'Linux'"]
dev = ["numpy>=1.26", "pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["sr_states*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["cuda: requires an NVIDIA CUDA device", "statistical: randomized statistical test"]

[tool.ruff]
line-length = 100
target-version = "py310"

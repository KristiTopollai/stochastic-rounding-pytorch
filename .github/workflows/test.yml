name: tests

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            torch: "2.5.0"
          - python: "3.12"
            torch: "latest"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - if: matrix.torch != 'latest'
        run: pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
      - if: matrix.torch == 'latest'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[dev]' build twine
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: |
          python results/h200-states-20261002/summarize.py --output "$RUNNER_TEMP/results-audit"
          diff -r results/h200-states-20261002/report "$RUNNER_TEMP/results-audit"
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: pip install --force-reinstall --no-deps dist/*.whl
      - run: |
          cd "$RUNNER_TEMP"
          python -c "from sr_states.triton import AdamWTriton, SGDMTriton; from sr_states.compiled import AdamWCompiledSR, SGDMCompiledSR; import benchmarks.bench_states, benchmarks.bench_optimizer_steps"
